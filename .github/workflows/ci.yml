name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl libsecret-tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend tests
        run: bash tests/test_smartac.sh
      - name: Model tests
        run: node tests/test_model.js
